:root{--green:#176b56;--ink:#20302c;--muted:#65746e;--paper:#f4f7f5;--line:#dfe8e2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:11px 16px;z-index:2;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.title{font-weight:800;margin-right:auto}.btn,select,input{font:inherit;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:8px 11px}.btn{cursor:pointer;font-weight:700}.btn.green{background:var(--green);border-color:var(--green);color:white}.wrap{max-width:1100px;margin:18px auto;padding:0 14px}.meta{display:flex;gap:14px;justify-content:space-between;align-items:center;margin:12px 0;color:var(--muted);font-size:13px}.imagebox{background:#25322d;border-radius:12px;min-height:70vh;padding:14px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}.imagebox img{width:100%;max-width:850px;height:auto;transform:rotate(0);transform-origin:center;transition:width .15s}.grid{display:none;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}.grid.open{display:grid}.thumb{border:1px solid var(--line);background:white;border-radius:9px;padding:6px;cursor:pointer;text-align:center;font-size:12px}.thumb img{width:100%;height:150px;object-fit:contain}.help{font-size:12px;color:var(--muted)}@media(max-width:650px){.bar{position:static}.title{width:100%}.imagebox{min-height:60vh;padding:6px}.meta{flex-direction:column;align-items:flex-start}}
</style></head><body><header class="bar"><a class="btn" href="../estudo-crc.html">← Voltar à Trilha CRC</a><div class="title">Apostila preparatória CFC · 73 páginas</div><select id="unit"><option value="">Todas as páginas</option><option value="1">Unidade 1 — Fundamentos</option><option value="2">Unidade 2 — Contabilidade Geral</option><option value="3">Unidade 3 — Custos e análise</option><option value="4">Unidade 4 — Setor público, Direito, Ética, Auditoria e Perícia</option><option value="5">Questões e referências</option></select><label>pág. <input id="page" type="number" min="1" max="73" value="1" style="width:64px"></label><button class="btn" id="prev">← Anterior</button><button class="btn green" id="next">Próxima →</button><button class="btn" id="rotate">Girar 90°</button><label>Zoom <input id="zoom" type="range" min="55" max="150" value="100"></label><button class="btn" id="gridToggle">Miniaturas</button></header><main class="wrap"><div class="meta"><span id="caption">Página 1 de 73</span><span class="help">Algumas fotos foram tiradas na horizontal; use “Girar 90°” e zoom para ler.</span></div><div class="imagebox"><img id="pageImage" alt="Página digitalizada da apostila"></div><div id="thumbs" class="grid"></div></main><script>
